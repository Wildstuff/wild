# The REPORT — the second published app of this tribe (ADR-0154), and the one
# written for the accountant rather than for the schema.
#
# `liquidity-cockpit.yaml` beside this file is the working surface AND the
# view-kind showcase: it exercises the schema broadly, which makes it a poor
# thing to hand someone who wants to know how the business is doing. This app
# answers exactly three questions, in the order a Buchhalter asks them:
#
#   1. How much cash do we actually have?          → `cash_position`
#   2. How many invoices are there, and how much   → `invoice_book`
#      of it is still open or already overdue?
#   3. What is coming in and going out, week by    → `cash_forecast`
#      week, for the next 13 weeks?
#
# Then it shows the two lists those numbers fold from — the accounts and the
# bank movements — so no figure on the page is one an operator has to take on
# trust. That is the whole app; there is no fourth page.
#
# EVERY headline figure here is a projection MEASURE. A `kpi-tile` and a
# `chart` bind a projection, never an entity, and the tile's read is a SUM of
# the measure across the projection's rows — so the four read-models this page
# needs (`cash_position`, `invoice_book`, `cash_movement`, `cash_forecast`)
# are declared in `../ontology/model.yaml`, not computed here. A view composes;
# it never calculates.
#
# Validate with: wild app validate apps/liquidity-report.yaml

id: liquidity-report
name: Liquidity Report

# No `default_tribe:` — see the cockpit beside this file. Absent, every view
# binds the tribe the app is published under, so the bundle deploys under any
# id (`wild tribe apply … --as acme-liquidity`) without the app going dark.

branding:
  logo: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%230f766e'/><path d='M7 13l3 3 7-8' stroke='white' stroke-width='2' fill='none'/></svg>"
  accent: teal
  color_scheme: system
  # A READING surface: `normal` is the deliberate middle of the three presets
  # (the cockpit beside this file is `compact`, the fitness client app is
  # `comfortable`). The preset multiplies the whole spacing ladder — it stopped
  # being inert on 2026-08-04, so it is a real choice now rather than a label.
  density: normal
  radius: 8
  palette:
    primary: teal
    success: green
    warning: amber
    danger: red
    surface: gray

pages:
  - id: report
    title: Liquidity Report
    onboarding:
      title: What this page tells you
      message: >-
        Top row: the cash actually on the accounts, how many invoices are still
        open, and how much of that is already overdue. Below it, the next 13
        weeks — expected incoming against expected outgoing, one bar per week.
        At the bottom, the accounts and the bank movements the figures above
        fold from.
      when: first_visit

    # ADR-0175 G9 — three tiles across the top, then each block full width.
    # On mobile the same order collapses into one column.
    layout:
      type: grid
      columns: ["1fr", "1fr", "1fr", "1fr"]
      gap: 16
      areas:
        - "cash open overdue due"
        - "incoming incoming incoming incoming"
        - "outgoing outgoing outgoing outgoing"
        - "book book book book"
        - "accounts accounts accounts accounts"
        - "movements movements movements movements"
      cells:
        - { view: cash-on-hand, area: cash }
        - { view: open-invoices-count, area: open }
        - { view: overdue-amount, area: overdue }
        - { view: expected-in, area: due }
        - { view: forecast-incoming, area: incoming, wide: true }
        - { view: forecast-outgoing, area: outgoing, wide: true }
        - { view: invoice-book, area: book, wide: true }
        - { view: account-balances, area: accounts, wide: true }
        - { view: bank-movements, area: movements, wide: true }
      breakpoints:
        - name: mobile
          columns: ["1fr"]
          areas:
            - "cash"
            - "open"
            - "overdue"
            - "due"
            - "incoming"
            - "outgoing"
            - "book"
            - "accounts"
            - "movements"

    views:
      # ── The three headline figures ─────────────────────────────────────────
      # Cash on hand. The tile SUMS `total_balance` across the projection's rows
      # — one row per currency — so an overdrawn account pulls the figure down
      # instead of hiding behind a positive sibling.
      - id: cash-on-hand
        type: kpi-tile
        projection: cash_position
        measure: total_balance
        label: Cash on hand
        format: "currency:EUR"

      # How many invoices are still open — both directions, since a payable is
      # as much an open invoice as a receivable. The split per direction is the
      # `invoice-book` table below; this is the one number.
      - id: open-invoices-count
        type: kpi-tile
        projection: invoice_book
        measure: open_count
        label: Open invoices

      # What is already late. Folded from BOTH verdicts — still owed
      # (`settlement: open`, the derived field that picks the tribe's override
      # over the feed's mirror) AND late (`aging_state: overdue`, written by
      # the daily ADR-0157 tick). Two fields because they
      # are two facts: an overdue invoice is still an open one, and a paid one
      # keeps the record that it was paid late. Correct as of the last tick,
      # never staler than a day, never a clock-dependent fiction folded at
      # read time.
      - id: overdue-amount
        type: kpi-tile
        projection: invoice_book
        measure: overdue_amount
        label: Overdue
        format: "currency:EUR"

      # What is still to come in, and WHEN. ADR-0189 D7 — the `trend` block adds
      # a sparkline beside the figure: the same measure, folded into 13 weekly
      # buckets along `due_date`. It is the one tile on this page that can carry
      # one, and that is an ontology fact rather than a taste: a trend buckets
      # the measure over a DATE FIELD OF THE SAME PROJECTION, and of the four
      # read-models this report binds only `cash_forecast` has one (`cash_position`
      # keys on currency, `invoice_book` on direction — neither has a clock).
      #
      # Read the two halves separately, because they answer different questions:
      # the FIGURE sums the measure across every row of the projection — every
      # open outbound invoice, whenever it falls due — while the SPARKLINE is
      # only the next 13 weeks. A figure larger than the curve suggests is money
      # due beyond the window, not a rounding error.
      #
      # `start: today` is the intent; the host resolves it where the read is
      # served, so the sparkline never needs re-cutting.
      - id: expected-in
        type: kpi-tile
        projection: cash_forecast
        measure: expected_in
        label: Expected in
        format: "currency:EUR"
        trend:
          over: due_date
          by: week
          start: today
          buckets: 13
        # The sparkline shares the chart's `--wv-accent` read-site, so a KPI
        # tile takes the same Tier-2 palette a chart does (ADR-0209 S1) — teal
        # here, matching the incoming-forecast chart below it.
        style:
          palette: [teal]

      # ── The 13-week forecast ───────────────────────────────────────────────
      # ADR-0154 PR3d — the `window:` block turns the chart's read into a
      # TimeBucket fold: 13 consecutive 7-day windows along `due_date`, summing
      # the measure inside each. Two charts rather than one, because the read
      # plan folds ONE measure per chart (`y[0]`) — and because money in and
      # money out on a shared axis invites reading a difference that neither
      # bar states.
      #
      # `start: today` is the INTENT, not a date: the host resolves the token
      # where the read is served, so this window is always the next 13 weeks
      # and never needs re-cutting. An absolute date here would be correct
      # exactly until it was old, then silently render an empty chart — which
      # reads as missing data, not as a stale spec.
      - id: forecast-incoming
        type: chart
        projection: cash_forecast
        x: due_date
        y: [expected_in]
        shape: bar
        exportable: true
        window:
          start: today
          bucket_days: 7
          buckets: 13
        style:
          palette: [teal]

      - id: forecast-outgoing
        type: chart
        projection: cash_forecast
        x: due_date
        y: [expected_out]
        shape: bar
        exportable: true
        window:
          start: today
          bucket_days: 7
          buckets: 13
        style:
          palette: [amber]

      # ── The lists the figures fold from ────────────────────────────────────
      # The invoice book per direction — the split behind the "open invoices"
      # tile, and where a reader sees that inbound and outbound are counted
      # under one roof.
      - id: invoice-book
        type: table
        source: projection
        projection: invoice_book
        columns:
          - invoice_count
          - open_count
          - open_amount
          - overdue_amount

      # The accounts themselves. `opening_balance` + `opening_date` are on the
      # type so this table is AUDITABLE: opening balance plus every movement
      # booked since that date equals `balance`. The seed data is generated to
      # satisfy exactly that, so the check is one an operator can actually run.
      - id: account-balances
        type: table
        source: entity
        entity: bank_account
        exportable: true
        empty_state:
          title: No accounts yet
          message: >-
            Add your bank accounts, or point the bank feed at your export
            folder — the balances appear here as soon as the first one lands.
          when: no_records

      # The movements. Personalizable, so an operator can keep their own
      # filtered view (ADR-0162) — "only the main account", "only debits".
      - id: bank-movements
        type: table
        source: entity
        entity: transaction
        exportable: true
        personalizable: true
        empty_state:
          title: No bookings yet
          message: >-
            Bank movements arrive through the hourly `bank-transactions` feed.
            Point its locator at your export folder to fill this list.
          when: no_records
